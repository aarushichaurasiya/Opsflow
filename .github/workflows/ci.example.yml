name: OpsFlow CI Example

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # Add pnpm setup, dependency install, lint, typecheck,
      # unit/integration/E2E tests, security checks and build
      # after the repository scripts are implemented.
