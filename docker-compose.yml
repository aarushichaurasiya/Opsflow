# Example local infrastructure based on the supplied OpsFlow stack.
# Final ports/images/healthchecks should be aligned with the actual application implementation.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opsflow
      POSTGRES_USER: opsflow
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
